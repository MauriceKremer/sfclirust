[package]
name = "sf-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sf-api = { path = "../sf-api" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror = "1.0"
reqwest.workspace = true
base64.workspace = true
ring.workspace = true
zip.workspace = true

# keyring 3 has no default backend: without a platform feature it silently uses
# a per-process mock store, so saved logins vanish when the process exits.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.0", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.0", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.0", features = ["linux-native"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
