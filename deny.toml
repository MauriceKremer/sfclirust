# Salesforce CLI Rust Reimplementation - Dependency Policy
#
# This project is licensed under MIT. All dependencies must use compatible licenses.
#
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Security: Deny all known vulnerabilities
db-path = "~/.cargo/advisory-db"

[licenses]
# Require all dependencies to declare a license compatible with MIT
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]

[bans]
# Check for multiple versions of a crate (can cause bloat and surprising behavior)
multiple-versions = "warn"

[sources]
# Require dependencies to come from well-known registries only
unknown-registry = "deny"
unknown-git = "deny"


