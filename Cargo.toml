[workspace]
members = ["crates/sf-cli", "crates/sf-core", "crates/sf-api"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"  # MSRV required for Edition 2024; verify against dependency graph
authors = ["Salesforce"]
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
keyring = "3.0"
secrecy = "0.10"
zeroize = "1.8"
tempfile = "3.10"
wiremock = "0.6"
assert_cmd = "2.0"
proptest = "1.4"
quick-xml = "0.32"
