# Lifecycle hooks
hooks:
  command_incomplete: "./dist/hooks/incomplete"
  plugins_preinstall: "./dist/hooks/pluginsPreinstall.js"
  update: "./dist/hooks/display-release-notes.js"
  prerun: "./dist/hooks/prerun"
  preparse: "/dist/hooks/preparse"

# Additional resources
salesforce_api:
  note: "The CLI interacts with Salesforce orgs via REST and SOAP APIs. Specific API versions depend on org configuration and command requirements. No single pinned API version applies to the entire CLI."

# Validation notes
validation:
  - "This baseline represents an actual published distribution, not a development snapshot."
  - "Another developer can install @salesforce/cli@2.158.4 from npm and verify the bundled plugins match this inventory."
  - "Bundled plugins are pinned versions; caret/tilde constraints on transitive dependencies mean transitive versions may vary."
  - "JIT plugins are not installed until explicitly requested by a command."
  - "The release commit 8ca3ae36d1 is immutable and verifiable; source inspection of intermediate commits is separate documentation."
