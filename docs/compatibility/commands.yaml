# Salesforce CLI First-Party Command Inventory
#
# This document records the first vertical slice of commands to be ported
# and their compatibility requirements. All recorded commands must be verified
# end-to-end before marking them complete. Commands are grouped by milestone.
#
# Milestones are defined in technical-architecture.md §3.2.
#
# Acronyms:
# - JIT: Just-In-Time plugin (installed on demand, not bundled)
# - Bundled: Always installed with the CLI
# - SOQL: Salesforce Object Query Language
# - Async: Command runs asynchronously and may require polling

## Milestone 1: Authenticated read workflows
## Scope: Browser and ephemeral token login, logout, alias/config, org list/display, SOQL query.
#
# Current native auth scope: browser authorization-code OAuth with mandatory PKCE
# S256, state-validated callback on an ephemeral 127.0.0.1 listener, and bounded
# callback timeout/cancellation. These library capabilities do not make a CLI
# command supported: all command entries below remain planned until credential
# storage, command wiring, and pinned JSON/exit tests pass.
# Ephemeral headless credential injection remains a separate planned operation;
# its upstream command contract is inventoried below, but it is not implemented
# as a native command or represented as supported.

# Category: Authentication - Browser-based OAuth login
- id: org-login-web
  command: "sf org login web"
  plugin: "@salesforce/plugin-auth"
  plugin_version: "6.0.4"
  category: "bundled"
  owner: "salesforcecli/plugin-auth"
  source_url: "https://github.com/salesforcecli/plugin-auth/tree/6.0.4/src/commands/org/login/web.ts"
  aliases: ["force:auth:web:login", "auth:web:login"]
  status: planned
  native_implementation:
    flow: "OAuth authorization code with mandatory PKCE S256"
    callback: "Ephemeral listener bound to IPv4 loopback only"
    client_id: "Explicit client ID required by the native flow"
    command_status: "Not supported until browser launch and secure persistence are wired"
  
  purpose: "Authenticate to a Salesforce org using browser-based OAuth flow."
  
  default_output: "JSON object containing authenticated org details."
  
  # Flags captured from plugin-auth 6.0.4, including aliases and dependencies.
  flags:
    - name: "--browser"
      char: "-b"
      type: "string"
      values: ["chrome", "edge", "firefox"]
      summary: "Browser to use for authentication"
      optional: true
    
    - name: "--client-id"
      char: "-i"
      type: "string"
      summary: "OAuth client ID (overrides plugin defaults)"
      optional: true
      aliases: ["--clientid"]
    
    - name: "--instance-url"
      char: "-r"
      type: "url"
      summary: "Salesforce instance URL (e.g., https://login.salesforce.com)"
      aliases: ["--instanceurl", "-l"]
      optional: true
    
    - name: "--alias"
      char: "-a"
      type: "string"
      summary: "Alias for the authenticated org"
      optional: true
      aliases: ["--setalias"]
    
    - name: "--set-default"
      char: "-s"
      type: "boolean"
      summary: "Set as the default org"
      optional: true
      aliases: ["--setdefaultusername"]
    
    - name: "--set-default-dev-hub"
      char: "-d"
      type: "boolean"
      summary: "Set as the default Dev Hub org"
      optional: true
      aliases: ["--setdefaultdevhubusername", "--setdefaultdevhub", "-v"]

    - name: "--no-prompt"
      char: "-p"
      type: "boolean"
      optional: true
      hidden: true
      aliases: ["--noprompt"]

    - name: "--client-app"
      char: "-c"
      type: "string"
      optional: true
      depends_on: ["--username"]

    - name: "--username"
      type: "string"
      optional: true
      depends_on: ["--client-app"]

    - name: "--scopes"
      type: "string"
      optional: true
      validation: "Must not contain commas"

    - name: "--loglevel"
      type: "string"
      optional: true
  
  # Exit codes and error conditions
  exit_codes:
    - code: 0
      meaning: "Authentication successful"
    
    - code: 1
      meaning: "Authentication failed or user cancelled"
      note: "Browser closed, network error, OAuth denial, etc."
    
    - code: 2
      meaning: "CLI argument parsing or validation failure"
  
  # Credential and state side effects
  side_effects:
    - "Opens a browser window to the Salesforce login page"
    - "Stores credentials in the OS secure credential store"
    - "May create/update org alias in config"
    - "Updates default org selection if --set-default or --set-default-dev-hub used"
    - "Writes OAuth tokens to secure storage; does not output secrets to stdout"
  
  # Upstream behavior to preserve
  contracts:
    - "JSON output must include org ID, username, instance URL, and auth type"
    - "Secrets (access tokens, refresh tokens) are NOT displayed in output"
    - "Alias must match stored org identity for future commands"
    - "Default org selection persists across CLI invocations"
    - "Deprecated aliases (force:auth:web:login, auth:web:login) must still work if supported"
    - "--client-app requires --username and --username requires --client-app"
    - "--scopes accepts a space-delimited scope string and rejects comma-separated input"
    - "Container mode fails explicitly rather than attempting an interactive browser login"
  
  # Dependencies and prerequisites
  dependencies:
    - "@salesforce/core" # AuthInfo, OAuth2Config, WebOAuthServer
    - "@salesforce/sf-plugins-core" # SfCommand, Flags
    - "@salesforce/kit" # Env, utility functions
    - "open" # Browser launching (npm package)
  
  # Salesforce API versions used
  salesforce_api:
    - endpoint: "OAuth2 /services/oauth2/authorize and /services/oauth2/token"
      version: "Determined by instance URL"
  
  # Test requirements
  testing:
    - "Positive: successful browser login flow"
    - "Negative: browser closed by user (exit code 1)"
    - "Negative: invalid --instance-url (exit code 2)"
    - "Negative: network unreachable"
    - "Integration: verify credentials stored securely after successful login"
    - "Integration: verify alias persists in config"
  
  # Exclusions and known limitations
  exclusions:
    - "No headless mode in initial implementation"
    - "No custom client secret support (client-id only)"
  
  migration_note: |
    Ported from upstream plugin-auth. This command is a foundation for the 
    M1 milestone and must work end-to-end before any command depending on 
    credentials is marked complete.

---

# Category: Authentication - Ephemeral access-token login
- id: org-login-access-token
  command: "sf org login access-token"
  plugin: "@salesforce/plugin-auth"
  plugin_version: "6.0.4"
  category: "bundled"
  owner: "salesforcecli/plugin-auth"
  source_url: "https://github.com/salesforcecli/plugin-auth/tree/6.0.4/src/commands/org/login/access-token.ts"
  aliases: ["force:auth:accesstoken:store", "auth:accesstoken:store"]
  status: planned

  purpose: "Authenticate using an explicitly supplied Salesforce access token."

  flags:
    - name: "--instance-url"
      char: "-r"
      type: "url"
      required: true
      aliases: ["--instanceurl"]

    - name: "--set-default"
      char: "-s"
      type: "boolean"
      optional: true
      aliases: ["--setdefaultusername"]

    - name: "--set-default-dev-hub"
      char: "-d"
      type: "boolean"
      optional: true
      aliases: ["--setdefaultdevhub", "--setdefaultdevhubusername", "-v"]

    - name: "--alias"
      char: "-a"
      type: "string"
      optional: true
      aliases: ["--setalias"]

    - name: "--no-prompt"
      char: "-p"
      type: "boolean"
      optional: true
      aliases: ["--noprompt"]

    - name: "--loglevel"
      type: "string"
      optional: true

  token_input:
    format: '"<org id>!<access token>"'
    precedence:
      - "SF_ACCESS_TOKEN"
      - "SFDX_ACCESS_TOKEN"
      - "Piped stdin when stdin is not a TTY"
      - "Interactive secret prompt when stdin is a TTY and --no-prompt is absent"
    stdin_timeout_seconds: 60

  side_effects:
    - "Upstream stores auth fields and applies alias/default-org settings"
    - "The native headless source is ephemeral and must not persist the token or pass it to a child process"

  contracts:
    - "Reject access tokens that do not match the documented org-id/token format"
    - "A non-TTY stdin read is bounded and removes listeners on timeout"
    - "Do not prompt when --no-prompt is set"
    - "Do not display or log access-token contents"
    - "Native command remains planned until it can authenticate end to end using an explicitly ephemeral source"

  exit_codes:
    - code: 0
      meaning: "Authentication information accepted and stored"
    - code: 1
      meaning: "Invalid token, unavailable input, or authentication failure"
    - code: 2
      meaning: "Invalid flags or instance URL"

  migration_note: |
    Upstream behavior is pinned to plugin-auth 6.0.4. Native headless auth is
    intentionally ephemeral and does not reproduce upstream persistent storage.

---

# Category: Authentication - Logout
- id: org-logout
  command: "sf org logout"
  plugin: "@salesforce/plugin-auth"
  plugin_version: "6.0.4"
  category: "bundled"
  owner: "salesforcecli/plugin-auth"
  source_url: "https://github.com/salesforcecli/plugin-auth/tree/6.0.4/src/commands/org/logout.ts"
  aliases: ["force:auth:logout", "auth:logout"]
  status: planned
  native_implementation:
    remote_revocation_failure: "Attempt local credential deletion and report revocation failure"
  
  purpose: "Revoke authentication and delete stored credentials for an org."
  
  default_output: |
    Confirmation message indicating org(s) logged out.
    Example: "Successfully logged out of org alias 'prod' (username@example.com)"
  
  flags:
    - name: "--target-org"
      char: "-o"
      type: "string"
      summary: "Org alias or username to log out"
      optional: true
      aliases: ["--targetusername", "-u"]
      note: "Uses configured default if available; otherwise orgs may be selected interactively or by --all/JSON behavior"

    - name: "--client-app"
      char: "-c"
      type: "string"
      summary: "Remove a client-app authorization from the target org"
      optional: true
      depends_on: ["--target-org"]
    
    - name: "--all"
      char: "-a"
      type: "boolean"
      summary: "Log out all authenticated orgs"
      optional: true
      note: "Mutually exclusive with --target-org"
    
    - name: "--no-prompt"
      char: "-p"
      type: "boolean"
      summary: "Do not prompt for confirmation"
      optional: true
      aliases: ["--noprompt"]

    - name: "--loglevel"
      type: "string"
      optional: true
  
  exit_codes:
    - code: 0
      meaning: "Logout completed, no auths found, or no auths selected"
    
    - code: 1
      meaning: "Authentication, storage, confirmation, or unresolved-target failure"
    
    - code: 2
      meaning: "CLI argument parsing or validation failure"
  
  side_effects:
    - "Removes stored authentication for the selected org"
    - "A client-app-only logout removes the named client app authorization"
    - "Removes org from alias configuration if aliased"
    - "Updates default org if the logged-out org was the default"
  
  contracts:
    - "With --no-prompt and no resolved target org or --all, fail rather than prompt"
    - "With JSON output and no resolved target org or --all, fail rather than prompt"
    - "With no org found, return an empty result; an explicitly unresolved --target-org is an error"
    - "Logout removes stored auth; remote revocation is a distinct lifecycle action"
    - "Subsequent commands using this org must fail with 'not authenticated'"
  
  dependencies:
    - "@salesforce/core" # AuthInfo
    - "@salesforce/sf-plugins-core" # SfCommand
  
  testing:
    - "Positive: logout default org"
    - "Positive: logout specific org by alias"
    - "Positive: logout all orgs"
    - "Negative: logout non-existent org (exit code 2)"
    - "Integration: verify credentials deleted from secure store"
    - "Integration: verify subsequent login web works after logout"
  
  migration_note: |
    Ported from upstream plugin-auth. Critical for credential lifecycle; 
    must verify secure deletion before considering complete.

---

# Category: Org Metadata - List authenticated orgs
- id: org-list
  command: "sf org list"
  plugin: "@salesforce/plugin-org"
  plugin_version: "7.0.13"
  category: "bundled"
  owner: "salesforcecli/plugin-org"
  source_url: "https://github.com/salesforcecli/plugin-org/tree/7.0.13/src/commands/org/list.ts"
  aliases: ["force:org:list"]
  status: planned
  native_implementation:
    command_status: "Returns an explicit unsupported-command error until persistent storage is wired"
  
  purpose: "List all authenticated orgs with their aliases, usernames, and status."
  
  default_output: |
    JSON object fields: other, sandboxes, nonScratchOrgs, devHubs, scratchOrgs.
    Human output prints grouped org tables and a default-org legend.
    Global JSON mode returns the object shape; it is not a --columns table.
  
  flags:
    - name: "--verbose"
      type: "boolean"
      optional: true

    - name: "--all"
      type: "boolean"
      optional: true
      note: "Include expired and deleted scratch orgs"

    - name: "--clean"
      type: "boolean"
      optional: true
      note: "Remove expired scratch-org authorizations; prompts unless --no-prompt is set"

    - name: "--no-prompt"
      char: "-p"
      type: "boolean"
      optional: true
      aliases: ["--noprompt"]
      relationships:
        - requires: "--clean"

    - name: "--skip-connection-status"
      type: "boolean"
      optional: true
      aliases: ["--skipconnectionstatus"]

    - name: "--loglevel"
      type: "string"
      optional: true

    - name: "--json"
      type: "global boolean"
      optional: true
      note: "Inherited command JSON output selection"
  
  exit_codes:
    - code: 0
      meaning: "Successfully listed orgs (may be empty)"
    
    - code: 1
      meaning: "Error reading org configuration"
  
  side_effects:
    - "Read-only unless --clean removes expired scratch-org auth records"
  
  contracts:
    - "Sorts org groups and marks configured default orgs/Dev Hubs"
    - "Without --all, excludes expired and deleted scratch orgs"
    - "--all includes expired and deleted scratch orgs"
    - "--clean removes expired scratch-org auth records"
    - "JSON output has stable group keys and omits no groups"
    - "--no-prompt is valid only with --clean"
  
  dependencies:
    - "@salesforce/core" # AuthInfo, ConfigFile
    - "@salesforce/sf-plugins-core" # SfCommand, ux.table
  
  testing:
    - "Positive: list orgs after org login web"
    - "Positive: verify default org marked as default"
    - "Positive: --json output is valid JSON"
    - "Negative: list when no orgs authenticated (exit code 0, empty output)"
  
  migration_note: |
    Ported from upstream plugin-org. Normally read-only, with expired scratch-org
    cleanup as an explicit state-changing option.

---

# Category: Org Metadata - Display org details
- id: org-display
  command: "sf org display"
  plugin: "@salesforce/plugin-org"
  plugin_version: "7.0.13"
  category: "bundled"
  owner: "salesforcecli/plugin-org"
  source_url: "https://github.com/salesforcecli/plugin-org/tree/7.0.13/src/commands/org/display.ts"
  aliases: ["force:org:display"]
  status: planned
  
  purpose: "Display details of a Salesforce org (instance URL, version, ID, etc.)."
  
  default_output: |
    JSON fields include id, devHubId, apiVersion, accessToken (redacted),
    instanceUrl, username, clientId, alias, connectedStatus, clientApps, and
    applicable scratch-org metadata. Human output is an alphabetized
    Org Description table. Undefined fields are omitted.
  
  flags:
    - name: "--target-org"
      char: "-o"
      type: "string"
      summary: "Org alias or username"
      required: true
      aliases: ["--targetusername", "-u"]

    - name: "--api-version"
      type: "string"
      optional: true

    - name: "--verbose"
      type: "boolean"
      optional: true

    - name: "--loglevel"
      type: "string"
      optional: true
    
    - name: "--json"
      type: "global boolean"
      summary: "Output as JSON"
      optional: true
  
  exit_codes:
    - code: 0
      meaning: "Successfully retrieved org details"
    
    - code: 1
      meaning: "Org not authenticated or API error"
    
    - code: 2
      meaning: "Invalid org alias"
  
  side_effects:
    - "Refreshes auth and may update the stored session"
    - "Queries the org and its Dev Hub for connection/scratch-org details"
  
  contracts:
    - "Requires a resolved target org; it does not default the target flag"
    - "JSON omits absent/undefined fields and redacts access token, password, and verbose auth URL values"
    - "Returns identity, instance, API version, connection status, aliases, and applicable scratch-org metadata"
    - "An auth refresh failure warns and still displays available local auth details"
    - "The deprecated alias force:org:display remains available"
  
  dependencies:
    - "@salesforce/core" # AuthInfo, Connection
    - "@salesforce/sf-plugins-core" # SfCommand, ux
  
  salesforce_api:
    - endpoint: "/services/data/ (getVersion)"
    - endpoint: "/services/data/org/limits (getOrgLimits)"
    - version: "Varies by org; typically 50.0+"
  
  testing:
    - "Positive: display authenticated org details"
    - "Positive: --json output is valid JSON"
    - "Negative: org not authenticated (exit code 1)"
    - "Negative: invalid org alias (exit code 2)"
    - "Integration: verify API version matches org configuration"
  
  migration_note: |
    Ported from upstream plugin-org. Requires successful authentication and 
    network access to Salesforce. Dependency on org-login-web.

---

# Category: Query - SOQL query execution
- id: data-query
  command: "sf data query"
  plugin: "@salesforce/plugin-data"
  plugin_version: "5.1.26"
  category: "bundled"
  owner: "salesforcecli/plugin-data"
  source_url: "https://github.com/salesforcecli/plugin-data/tree/5.1.26/src/commands/data/query.ts"
  status: planned
  
  purpose: "Execute a SOQL query against a Salesforce org and return results."
  
  default_output: |
    Query results as a table (default) or JSON.
    Includes record count and query time.
  
  flags:
    - name: "--query"
      char: "-q"
      type: "string"
      summary: "SOQL query string"
      required: true
    
    - name: "--target-org"
      char: "-o"
      type: "string"
      summary: "Org alias or username"
      optional: true
      note: "If omitted, uses default org"
    
    - name: "--json"
      type: "boolean"
      summary: "Output as JSON"
      optional: true
    
    - name: "--result-format"
      type: "string"
      values: ["csv", "json", "human"]
      summary: "Output format"
      optional: true
  
  exit_codes:
    - code: 0
      meaning: "Query executed successfully"
    
    - code: 1
      meaning: "Query failed or org not authenticated"
    
    - code: 2
      meaning: "Invalid query syntax"
  
  side_effects:
    - "Makes SOQL query to org"
    - "No writes to org or credential store"
  
  contracts:
    - "Query results must match Salesforce query engine"
    - "JSON output must include records array and query metadata"
    - "Must handle large result sets (pagination)"
    - "Must properly escape/sanitize user input in queries"
  
  dependencies:
    - "@salesforce/core" # AuthInfo, Connection
    - "@salesforce/plugin-data" # Query parsing
    - "@salesforce/sf-plugins-core" # SfCommand, ux
  
  salesforce_api:
    - endpoint: "/services/data/query"
    - version: "Determined by org API version"
  
  testing:
    - "Positive: query Account records"
    - "Positive: query with WHERE clause"
    - "Positive: query returns large result set (>10,000 records)"
    - "Positive: --json output is valid JSON"
    - "Negative: invalid SOQL syntax (exit code 2)"
    - "Negative: org not authenticated (exit code 1)"
    - "Security: verify parameterized queries prevent injection"
  
  migration_note: |
    Ported from upstream plugin-data. This is a read-only command that 
    demonstrates authenticated API access. Dependency on org-login-web.

---

# Vertical Slice Summary
# =====================
#
# The first implementation slice includes:
# 1. org login web      - Browser-based OAuth authentication
# 2. org logout         - Credential revocation and cleanup
# 3. org list           - List authenticated orgs
# 4. org display        - Display org metadata
# 5. data query         - SOQL query execution
#
# These commands form a complete, end-to-end workflow:
# - Authenticate a user (org login web)
# - Verify authentication state (org list, org display)
# - Perform a basic operation (data query)
# - Clean up (org logout)
#
# Success criteria:
# - All commands work offline or with a test Salesforce sandbox
# - Credentials are stored and retrieved securely
# - JSON output is consistent and schema-compliant
# - Exit codes and error messages match upstream behavior
# - No Rust code is copied from upstream; behavior is ported

